[package]
name = "magicx-ram-cleaner"
version = "1.0.0"
edition = "2024"
authors = ["MagicX"]
description = "The most powerful Windows RAM cleaner CLI — surpasses EmptyStandbyList with granular control over every memory subsystem"
license = "MIT"
readme = "README.md"
keywords = ["ram", "memory", "cleaner", "windows", "standby-list"]
categories = ["command-line-utilities", "os::windows-apis"]
repository = "https://github.com/ehsan18t/magicx-ram-cleaner"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Windows API casts (u32↔i32, usize→u32) are inherent to the FFI boundary.
# Precision loss in u64→f64 is acceptable for human-readable display formatting.
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Binary-only crate: modules are pub solely for criterion benchmark access,
# not for use as a public library API. Public-API documentation lints are
# intentionally relaxed.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
# Deny common footguns
let_underscore_drop = "deny"
non_ascii_idents = "deny"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
clap = { version = "4", features = ["derive", "color", "help", "usage", "suggestions"] }
colored = "3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.winresource]
OriginalFilename = "magicx-ram-cleaner.exe"
ProductName = "MagicX RAM Cleaner"
FileDescription = "The most powerful Windows RAM cleaner CLI"
LegalCopyright = "Copyright \u00a9 2025 MagicX — MIT License"
CompanyName = "MagicX"
InternalName = "magicx-ram-cleaner"
Comments = "Surpasses EmptyStandbyList with granular control over every Windows memory subsystem"

[build-dependencies]
embed-manifest = "1"
winresource = "0.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
