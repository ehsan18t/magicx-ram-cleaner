# MagicX RAM Cleaner — cargo-deny configuration
# Audits dependencies for security vulnerabilities, license issues, and bans.
# Run: cargo deny check
# Install: cargo install cargo-deny

[advisories]
# Warn only when a direct workspace dependency is unmaintained.
# Vulnerabilities, yanked crates, and notices are denied by default in cargo-deny 0.19+.
unmaintained = "workspace"
ignore = []

[licenses]
# Only allow these licenses — anything unlisted is denied by default.
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# Windows-sys uses MIT, clap uses MIT/Apache-2.0, etc.
# If a new dependency brings in a weird license, this will catch it.

[[licenses.clarify]]
name = "unicode-ident"
expression = "(MIT OR Apache-2.0) AND Unicode-DFS-2016"
license-files = [{ path = "LICENSE-UNICODE", hash = 0x3fb01745 }]

[bans]
# Deny duplicate versions of the same crate (keeps binary small)
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Skip known transitive duplicates introduced by eframe/tray-icon dependency trees.
# These are cross-platform support crates (GTK bindings, winit, glutin) that pull
# in different major versions of windows-sys/toml_edit — unavoidable without
# upstream changes.
skip = [
    # windows-sys/windows-targets version sprawl — eframe, tray-icon, and their
    # transitive deps (winit, glutin, arboard, muda, rustix, jni) each pin
    # different semver-incompatible windows-sys versions. Cannot be unified
    # without upstream changes.
    { crate = "windows-sys@0.45.0", reason = "jni (android-activity) via winit" },
    { crate = "windows-sys@0.52.0", reason = "glutin/winit via eframe" },
    { crate = "windows-sys@0.59.0", reason = "rustix via winit" },
    { crate = "windows-sys@0.60.2", reason = "arboard/muda/tray-icon" },
    { crate = "windows-targets@0.42.2", reason = "windows-sys 0.45 via jni" },
    { crate = "windows-targets@0.52.6", reason = "windows-sys 0.52/0.59 via eframe" },

    # windows_* arch-specific link crates follow windows-targets version sprawl
    { crate = "windows_aarch64_gnullvm@0.42.2" },
    { crate = "windows_aarch64_gnullvm@0.52.6" },
    { crate = "windows_aarch64_msvc@0.42.2" },
    { crate = "windows_aarch64_msvc@0.52.6" },
    { crate = "windows_i686_gnu@0.42.2" },
    { crate = "windows_i686_gnu@0.52.6" },
    { crate = "windows_i686_gnullvm@0.52.6" },
    { crate = "windows_i686_msvc@0.42.2" },
    { crate = "windows_i686_msvc@0.52.6" },
    { crate = "windows_x86_64_gnu@0.42.2" },
    { crate = "windows_x86_64_gnu@0.52.6" },
    { crate = "windows_x86_64_gnullvm@0.42.2" },
    { crate = "windows_x86_64_gnullvm@0.52.6" },
    { crate = "windows_x86_64_msvc@0.42.2" },
    { crate = "windows_x86_64_msvc@0.52.6" },

    # toml/winnow version sprawl — tray-icon's GTK bindings pull multiple
    # proc-macro-crate versions, each requiring different toml_edit.
    { crate = "toml_datetime@0.6.3", reason = "proc-macro-crate v1 via tray-icon GTK bindings" },
    { crate = "toml_edit@0.19.15", reason = "proc-macro-crate v1 via tray-icon GTK bindings" },
    { crate = "toml_edit@0.20.2", reason = "proc-macro-crate v2 via tray-icon GTK bindings" },
    { crate = "winnow@0.5.40", reason = "older toml_edit versions via tray-icon GTK bindings" },

    # Cross-platform support crate duplicates from eframe's multi-platform deps
    { crate = "block2@0.5.1", reason = "objc2 version difference in eframe deps" },
    { crate = "calloop@0.13.0", reason = "winit uses older calloop than smithay" },
    { crate = "core-foundation@0.9.4", reason = "older core-foundation via eframe deps" },
    { crate = "getrandom@0.2.17", reason = "older getrandom via tray-icon/dirs transitive deps" },
    { crate = "libloading@0.7.4", reason = "glutin uses older libloading" },
    { crate = "linux-raw-sys@0.4.15", reason = "older rustix via winit" },
    { crate = "objc2@0.5.2", reason = "eframe deps use different objc2 versions" },
    { crate = "objc2-app-kit@0.2.2", reason = "eframe deps use different objc2 versions" },
    { crate = "objc2-foundation@0.2.2", reason = "eframe deps use different objc2 versions" },
    { crate = "png@0.17.16", reason = "tray-icon uses older png than image crate" },
    { crate = "redox_syscall@0.4.1", reason = "older redox_syscall via eframe deps" },
    { crate = "rustix@0.38.44", reason = "winit/calloop use older rustix" },
]
skip-tree = [
    # All GTK/GLib Linux-only transitive deps from tray-icon — not compiled on Windows
    { crate = "gtk@0.18.2", reason = "Linux-only tray-icon dep, not compiled on Windows" },
]

# Ban known-problematic crates
deny = [
    # openssl — we don't need it and it's a security liability
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
# Only allow crates from crates.io — no random git repos
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
