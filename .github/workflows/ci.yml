# MagicX RAM Cleaner — CI Pipeline
# Enforces code quality on pull requests. All checks must pass before merging.
#
# Gates (ALL must pass):
#   1. cargo fmt --check            → consistent formatting
#   2. cargo clippy (deny)          → zero lint warnings (all+pedantic+nursery)
#   3. cargo test --locked          → all tests pass, Cargo.lock respected
#   4. cargo bench --no-run         → benchmarks compile without errors
#   5. cargo build                  → debug binary compiles
#   6. cargo doc                    → documentation + doc-comment format valid
#   7. cargo deny check             → no vulnerable/banned dependencies

name: CI

on:
  pull_request:
    branches: [main]

# Principle of least privilege — CI only reads source, never pushes.
permissions:
  contents: read

# Cancel any in-progress run for the same PR branch to avoid wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo/registry, ~/.cargo/git/db, and a pruned target/ dir.
      # Key: OS + Rust toolchain version + all Cargo.toml hashes + Cargo.lock hash.
      # When a package is added, Cargo.lock changes → key misses → nearest
      # matching restore-key is loaded → only new packages are downloaded and
      # only changed crates are recompiled.  Stale artifacts are pruned before
      # saving so the cache never grows unboundedly.
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Gate 1: Formatting — rejects inconsistent style
      - name: "Gate 1: cargo fmt --check"
        run: cargo fmt --all -- --check

      # Gate 2: Clippy (all+pedantic+nursery at deny level) — rejects lint violations.
      # Lint levels and per-lint overrides are configured in Cargo.toml [lints.clippy].
      # Only -D warnings is passed here to turn any remaining warnings into errors;
      # adding -W clippy::pedantic on the CLI would override the per-lint "allow"
      # entries in Cargo.toml (e.g. cast_precision_loss, missing_errors_doc).
      - name: "Gate 2: cargo clippy"
        run: cargo clippy --locked --all-targets -- -D warnings

      # Gate 3: Tests — rejects broken logic; --locked ensures Cargo.lock is honoured
      - name: "Gate 3: cargo test"
        run: cargo test --locked --all-targets

      # Gate 4: Benchmarks — rejects benchmarks that do not compile
      - name: "Gate 4: cargo bench --no-run"
        run: cargo bench --locked --no-run

      # Gate 5: Debug build — rejects code that does not compile
      - name: "Gate 5: cargo build"
        run: cargo build --locked

      # Upload the debug binary for inspection / smoke-testing.
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: magicx-ram-cleaner-${{ github.sha }}
          path: target/debug/magicx-ram-cleaner.exe
          retention-days: 7
          if-no-files-found: error

      # Gate 6: Documentation & doc-comment format — rejects broken links, bare URLs,
      # invalid code blocks, and missing crate-level docs.
      - name: "Gate 6: cargo doc"
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: >-
            -D warnings
            -D rustdoc::bare_urls
            -D rustdoc::invalid_rust_codeblocks
            -D rustdoc::private_intra_doc_links
            -D rustdoc::unescaped_backticks

  # Gate 7: Dependency audit — rejects vulnerable/banned/unlicensed dependencies.
  # cargo-deny binary is cached to avoid re-downloading on every run.
  audit:
    name: Dependency Audit
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache the cargo registry index so cargo-deny can resolve the package
      # graph without re-fetching metadata on every run.  Target compilation
      # artifacts are skipped (cargo deny check does not compile anything).
      - name: Cache Rust registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          cache-on-failure: true

      - name: Cache cargo-deny binary
        id: cache-deny
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-deny.exe
          # Bump the suffix (v1 → v2, etc.) to force a fresh install when
          # upgrading cargo-deny to a new major/minor version.
          key: cargo-deny-${{ runner.os }}-v1

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked

      - name: "Gate 7: cargo deny check"
        run: cargo deny check
